name: VetaStart staging checks
on:
  push:
    branches:
      - staging/cabinet-v1
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit
      - run: npm run check
      - run: npm test
